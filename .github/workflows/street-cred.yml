name: street-cred

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/street_cred.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate street-cred card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/street_cred.py
      - name: Commit if changed
        run: |
          git config user.name "street-cred[bot]"
          git config user.email "street-cred@users.noreply.github.com"
          git add assets/street-cred.svg
          git diff --cached --quiet || (git commit -m "chore: sync street cred" && git push)
