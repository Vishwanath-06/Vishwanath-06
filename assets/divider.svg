<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-label="Caution tape divider: OVERRIDE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="tape" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="20" height="40" fill="#FCEE0A"/>
      <rect x="20" width="20" height="40" fill="#050505"/>
      <animateTransform attributeName="patternTransform" type="translate" additive="sum" from="0 0" to="40 0" dur="3s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1000" height="44" fill="#050505"/>
  <rect x="0" y="6" width="1000" height="32" fill="url(#tape)"/>
  <rect x="0" y="6" width="1000" height="32" fill="none" stroke="#050505" stroke-width="2"/>
  <polygon points="350,2 640,2 654,22 640,42 350,42 336,22" fill="#050505" stroke="#D92121" stroke-width="2"/>
  <text x="495" y="28" font-family="'Share Tech Mono','Courier New',monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#FCEE0A" text-anchor="middle">/// OVERRIDE ///</text>
</svg>
