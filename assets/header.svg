<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Netrunner boot screen with a V insignia: Vishwanath, Netrunner, Solo, AI/ML Architect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00FFFF" opacity="0.07"/></pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="#D92121" opacity="0.2"/></pattern>
    <polygon id="vshape" points="22,10 62,10 100,118 138,10 178,10 190,22 114,190 86,190 10,22"/>
    <clipPath id="ctop"><rect x="0" y="0" width="200" height="70"/></clipPath>
    <clipPath id="cbot"><rect x="0" y="76" width="200" height="130"/></clipPath>
    <clipPath id="b1"><rect x="330" y="34" width="0" height="20"><animate attributeName="width" to="340" begin="0.4s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="b2"><rect x="330" y="54" width="0" height="20"><animate attributeName="width" to="340" begin="1.2s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="b3"><rect x="330" y="74" width="0" height="20"><animate attributeName="width" to="340" begin="2.0s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="b4"><rect x="330" y="94" width="0" height="20"><animate attributeName="width" to="340" begin="2.8s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="b5"><rect x="330" y="114" width="0" height="20"><animate attributeName="width" to="340" begin="3.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
    </defs>
  <rect width="1000" height="340" fill="#050505"/>
  <rect width="1000" height="340" fill="url(#scan)"/>
  <rect x="660" y="6" width="334" height="60" fill="url(#hatch)" opacity="0"><animate attributeName="opacity" to="1" begin="1s" dur="0.6s" fill="freeze"/></rect>
  <rect x="0" y="0" width="1000" height="3" fill="#00FFFF" opacity="0.14"><animate attributeName="y" values="0;340" dur="5s" repeatCount="indefinite"/></rect>

  <!-- frame draws itself -->
  <polygon points="26,6 994,6 994,314 968,334 6,334 6,26" fill="none" stroke="#FCEE0A" stroke-width="2" stroke-dasharray="2400" stroke-dashoffset="2400">
    <animate attributeName="stroke-dashoffset" to="0" dur="1.4s" fill="freeze"/>
  </polygon>
  <polyline points="6,60 6,26 26,6 90,6" fill="none" stroke="#D92121" stroke-width="5" opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.2s" fill="freeze"/></polyline>
  <polyline points="910,334 968,334 994,314 994,270" fill="none" stroke="#D92121" stroke-width="5" opacity="0"><animate attributeName="opacity" to="1" begin="1.3s" dur="0.2s" fill="freeze"/></polyline>

  <!-- V insignia -->
  <g transform="translate(70,30) scale(1.35)">
    <use href="#vshape" xlink:href="#vshape" fill="#D92121" transform="translate(7,4)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0;0.6;0;0" keyTimes="0;.55;.58;.62;.66;.7;1" dur="5s" begin="2.2s" repeatCount="indefinite"/>
    </use>
    <use href="#vshape" xlink:href="#vshape" fill="#00FFFF" transform="translate(-7,-3)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0;0.6;0;0" keyTimes="0;.56;.59;.63;.67;.71;1" dur="5s" begin="2.2s" repeatCount="indefinite"/>
    </use>
    <use href="#vshape" xlink:href="#vshape" fill="none" stroke="#FCEE0A" stroke-width="2" stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" to="0" begin="0.2s" dur="1.3s" fill="freeze"/>
    </use>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;12 0;-7 0;0 0;0 0" keyTimes="0;.55;.58;.62;.66;1" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      <g clip-path="url(#ctop)"><use href="#vshape" xlink:href="#vshape" fill="#FCEE0A" opacity="0"><animate attributeName="opacity" to="1" begin="1.4s" dur="0.4s" fill="freeze"/></use></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-10 0;6 0;0 0;0 0" keyTimes="0;.55;.58;.62;.66;1" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      <g clip-path="url(#cbot)"><use href="#vshape" xlink:href="#vshape" fill="#FCEE0A" opacity="0"><animate attributeName="opacity" to="1" begin="1.6s" dur="0.4s" fill="freeze"/></use></g>
    </g>
    <polygon points="100,150 108,160 100,170 92,160" fill="#D92121" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0.3;1" keyTimes="0;.01;.5;.75;1" dur="2s" begin="2s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <text x="205" y="320" font-family="'Share Tech Mono','Courier New',monospace" font-size="11" fill="#00FFFF" text-anchor="middle" opacity="0">NETRUNNER_ID // VISHWANATH-06<animate attributeName="opacity" to="1" begin="2s" dur="0.3s" fill="freeze"/></text>

  <!-- boot lines (typed) -->
  <g font-family="'Share Tech Mono','Courier New',monospace" font-size="13" fill="#00FFFF">
    <text x="330" y="48" clip-path="url(#b1)">&gt; KIROSHI OPTICS // COLD BOOT</text>
    <text x="330" y="68" clip-path="url(#b2)">&gt; SYNCING INTEL CORE i7-1355U ........ OK</text>
    <text x="330" y="88" clip-path="url(#b3)">&gt; MEMORY BANKS // 16GB DDR5 .......... OK</text>
    <text x="330" y="108" clip-path="url(#b4)">&gt; KAGGLE GPU ARRAY // T4 // 16GB ..... OK</text>
    <text x="330" y="128" clip-path="url(#b5)" fill="#FCEE0A">&gt; NETRUNNER LINK ESTABLISHED. WELCOME.</text>
  </g>

  <!-- glitch title -->
  <g font-family="'Share Tech Mono','Courier New',monospace" font-size="68" font-weight="700" letter-spacing="3">
    <text x="330" y="205" fill="#00FFFF" opacity="0">VISHWANATH
      <animate attributeName="x" values="330;326;334;330;330;330;330;338;330" keyTimes="0;.05;.1;.15;.6;.7;.8;.85;1" dur="5s" begin="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" to="0.7" begin="4.4s" dur="0.01s" fill="freeze"/></text>
    <text x="330" y="205" fill="#D92121" opacity="0">VISHWANATH
      <animate attributeName="x" values="330;335;327;330;330;330;330;322;330" keyTimes="0;.05;.1;.15;.6;.7;.8;.85;1" dur="5s" begin="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" to="0.8" begin="4.4s" dur="0.01s" fill="freeze"/></text>
    <text x="330" y="205" fill="#FCEE0A" opacity="0">VISHWANATH
      <animate attributeName="opacity" values="0;1;0;1;0.4;1" keyTimes="0;.2;.35;.5;.7;1" dur="0.7s" begin="4.3s" fill="freeze"/></text>
  </g>

  <!-- role bar -->
  <polygon points="330,226 842,226 856,240 856,262 330,262" fill="#FCEE0A" opacity="0"><animate attributeName="opacity" to="1" begin="4.8s" dur="0.3s" fill="freeze"/></polygon>
  <text x="344" y="250" font-family="'Share Tech Mono','Courier New',monospace" font-size="17" font-weight="700" fill="#050505" opacity="0">CLASS: NETRUNNER // SOLO // AI-ML ARCHITECT<animate attributeName="opacity" to="1" begin="5.0s" dur="0.3s" fill="freeze"/></text>
  <text x="330" y="284" font-family="'Share Tech Mono','Courier New',monospace" font-size="12" fill="#D92121" opacity="0">DESTINATION: THE MOON // IEEE PROCEEDINGS<animate attributeName="opacity" values="0;1;0.35;1" keyTimes="0;.1;.55;1" dur="2.2s" begin="5.2s" repeatCount="indefinite"/></text>

  <!-- breach protocol loader -->
  <text x="330" y="314" font-family="'Share Tech Mono','Courier New',monospace" font-size="12" fill="#00FFFF">BREACH PROTOCOL</text>
  <rect x="470" y="303" width="360" height="12" fill="none" stroke="#00FFFF" stroke-width="1.5"/>
  <rect x="473" y="306" width="0" height="6" fill="#FCEE0A"><animate attributeName="width" to="354" begin="4.2s" dur="2.4s" fill="freeze"/></rect>
  <text x="845" y="314" font-family="'Share Tech Mono','Courier New',monospace" font-size="12" font-weight="700" fill="#FCEE0A" opacity="0">GRANTED<animate attributeName="opacity" values="0;1;0.2;1" keyTimes="0;.01;.5;1" dur="1.2s" begin="6.6s" repeatCount="indefinite"/></text>
</svg>
